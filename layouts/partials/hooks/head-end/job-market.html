{{- /* Fonts + first-paint flags for the job-market design. Loaded by Wowchemy's head-end hook. */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<script>
/* Runs before first paint. jm-js enables the scroll-reveal styles; the flags below drive the entrance animations.
   - data-jm-intro: the photo/name intro on the home page. Plays once per visitor; add ?intro to any home URL to replay it.
   - jm-arriving: covers the page for a moment after a link click so the route "transition" feels continuous. */
(function () {
  var d = document.documentElement;
  d.classList.add("jm-js");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  {{ if .IsHome }}
  try { if (!localStorage.getItem("jmIntroSeen") || /[?&]intro\b/.test(location.search)) d.setAttribute("data-jm-intro", "1"); }
  catch (e) { d.setAttribute("data-jm-intro", "1"); }
  {{ end }}
  try { if (sessionStorage.getItem("jmNav")) d.classList.add("jm-arriving"); } catch (e) {}
})();
</script>
