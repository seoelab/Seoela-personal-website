description: This course examines the causes and consequences of international economic
  integration. We begin with an overview of global trade patterns and introduce the
  gravity model of trade. We then study classical and modern theories of international
  trade, including (a) comparative advantage, (b) economies of scale, and (c) imperfect
  competition. Building on these foundations, we analyze common trade policies and
  the political forces that shape them. We also explore how trade and international
  financial flows enter national income and balance-of-payments accounts, how exchange
  rates are determined and managed, and how countries organize themselves through
  international economic arrangements and policy frameworks. In the final part of
  the course, we turn to classic and contemporary issues in international trade, with
  particular attention to how trade interacts with development, migration, the environment,
  and labor markets—market failures that are increasingly central to international
  economics.
